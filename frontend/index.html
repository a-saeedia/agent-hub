<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Office Hub</title>
    <style>
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --panel-2: #1c2330;
        --border: #2a3441;
        --text: #e6edf3;
        --muted: #8b98a9;
        --accent: #58a6ff;
        --accent-2: #3fb950;
        --warn: #d29922;
        --err: #f85149;
        --mono: ui-monospace, SFMono-Regular, "Cascadia Code", Menlo, monospace;
        --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background:
          radial-gradient(1200px 600px at 70% -10%, #1a2332 0%, transparent 60%),
          var(--bg);
        color: var(--text);
        font-family: var(--sans);
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      /* ---- top bar ---- */
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 22px;
        border-bottom: 1px solid var(--border);
        background: rgba(13,17,23,0.7);
        backdrop-filter: blur(6px);
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .logo {
        width: 30px; height: 30px;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--accent), #7c3aed);
        display: grid; place-items: center;
        font-size: 16px;
        box-shadow: 0 0 18px rgba(88,166,255,0.35);
      }
      header h1 {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.02em;
        margin: 0;
      }
      header .sub {
        color: var(--muted);
        font-size: 12px;
        margin-left: 4px;
      }
      .spacer { flex: 1; }
      .conn {
        display: flex; align-items: center; gap: 7px;
        font-size: 12px; color: var(--muted);
        font-family: var(--mono);
      }
      .dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: var(--muted);
      }
      .dot.on { background: var(--accent-2); box-shadow: 0 0 8px var(--accent-2); }
      .dot.off { background: var(--err); }

      /* ---- main layout ---- */
      main {
        flex: 1;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 360px;
        gap: 18px;
        padding: 18px 22px;
        max-width: 1400px;
        width: 100%;
        margin: 0 auto;
      }
      @media (max-width: 900px) {
        main { grid-template-columns: 1fr; }
      }

      /* ---- office stage ---- */
      .stage {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        box-shadow: 0 8px 30px rgba(0,0,0,0.35);
      }
      .stage-head {
        display: flex; align-items: center; gap: 10px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--panel-2);
      }
      .stage-head .title { font-size: 13px; font-weight: 600; }
      .stage-head .hint { font-size: 11px; color: var(--muted); }
      .stage canvas {
        display: block;
        width: 100%;
        height: auto;
        image-rendering: pixelated;
        background: #0a0e14;
      }

      /* ---- side panel ---- */
      .side {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 16px;
      }
      .card h2 {
        margin: 0 0 12px;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }

      /* command box */
      .cmd-row { display: flex; gap: 8px; }
      #directive {
        flex: 1;
        background: #0d1117;
        border: 1px solid var(--border);
        color: var(--text);
        padding: 11px 13px;
        font: inherit;
        font-size: 13px;
        border-radius: 9px;
        transition: border-color 0.15s;
      }
      #directive:focus { outline: none; border-color: var(--accent); }
      #go {
        background: linear-gradient(135deg, var(--accent), #3b82f6);
        color: #fff;
        border: none;
        padding: 0 20px;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        border-radius: 9px;
        cursor: pointer;
        transition: transform 0.08s, filter 0.15s;
      }
      #go:hover { filter: brightness(1.1); }
      #go:active { transform: scale(0.97); }
      #go:disabled { opacity: 0.45; cursor: not-allowed; }

      /* status */
      #status {
        font-size: 13px;
        color: var(--muted);
        min-height: 1.4em;
        display: flex; align-items: center; gap: 8px;
      }
      #status .pulse {
        width: 8px; height: 8px; border-radius: 50%;
        background: var(--warn);
        animation: pulse 0.8s ease-in-out infinite;
      }
      @keyframes pulse { 50% { opacity: 0.2; } }
      #status.running { color: var(--warn); }
      #status.done-ok { color: var(--accent-2); }
      #status.done-err { color: var(--err); }

      /* log */
      #log {
        background: #0a0d12;
        border: 1px solid var(--border);
        border-radius: 9px;
        height: 300px;
        overflow-y: auto;
        padding: 10px 12px;
        font-family: var(--mono);
        font-size: 12px;
        line-height: 1.55;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #log .out { color: #c9d4e0; }
      #log .err { color: var(--err); }
      #log .meta { color: var(--muted); }
      #log .empty { color: #3a4654; }

      /* quick tasks */
      .chips { display: flex; flex-wrap: wrap; gap: 6px; }
      .chip {
        background: var(--panel-2);
        border: 1px solid var(--border);
        color: var(--text);
        font-size: 11px;
        padding: 5px 10px;
        border-radius: 20px;
        cursor: pointer;
        transition: border-color 0.15s, background 0.15s;
      }
      .chip:hover { border-color: var(--accent); background: #22304a; }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">🏢</div>
      <h1>Office Hub</h1>
      <span class="sub">command center</span>
      <div class="spacer"></div>
      <div class="conn"><span class="dot" id="connDot"></span><span id="connText">connecting…</span></div>
    </header>

    <main>
      <div class="stage">
        <div class="stage-head">
          <span class="title">The Office</span>
          <span class="hint">watch your agent walk to a desk and work</span>
        </div>
        <canvas id="office" width="960" height="640"></canvas>
      </div>

      <div class="side">
        <div class="card">
          <h2>Command</h2>
          <div class="cmd-row">
            <input id="directive" type="text" placeholder="type a task, e.g.  add a /health endpoint" autocomplete="off" />
            <button id="go">Run</button>
          </div>
          <div id="status" style="margin-top:10px">idle</div>
        </div>

        <div class="card">
          <h2>Quick tasks</h2>
          <div class="chips">
            <button class="chip" data-task="Reply with exactly the word OK and nothing else.">Say OK</button>
            <button class="chip" data-task="List the files in this project and summarize what each does.">Summarize project</button>
            <button class="chip" data-task="Explain in one sentence what a FastAPI WebSocket is.">Explain WebSocket</button>
          </div>
        </div>

        <div class="card">
          <h2>Output</h2>
          <div id="log"><span class="empty">— no output yet —</span></div>
        </div>
      </div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
